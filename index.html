<script>
  const solar = Solar.fromYmdHms(1990, 5, 15, 10, 30, 0);
  const lunar = solar.getLunar();
  const ec = lunar.getEightChar();
  console.log('年柱:', ec.getYear());
  console.log('月柱:', ec.getMonth());
  console.log('日柱:', ec.getDay());
  console.log('時柱:', ec.getTime());
</script>
